<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Pokédex - Detalle</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {
                font-family: 'Press Start 2P', monospace;
                background: linear-gradient(to bottom, #e63946, #9d0208);
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .pokedex {
                width: 1150px;
                max-width: 95%;
                background: #b71c1c;
                border: 10px solid #000;
                border-radius: 12px;
                display: flex;
                box-shadow: 0 12px 25px rgba(0,0,0,0.5);
                overflow: hidden;
            }

            /* Panel izquierdo: sprite */
            .left-panel {
                flex: 1;
                background: #111;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 25px;
                border-right: 8px solid #000;
            }
            .pokemon-name {
                font-size: 35px;
                color: #ffeb3b;
                text-transform: uppercase;
                margin-bottom: 10px;
            }
            .pokemon-id {
                font-size: 20px;
                color: #03a9f4;
                margin-bottom: 20px;
            }
            .left-panel img {
                width: 180px;
                height: 180px;
                image-rendering: pixelated;
            }

            /* Panel derecho: stats */
            .right-panel {
                flex: 2;
                background: #f5f5f5;
                padding: 15px;
                display: flex;
                flex-direction: column;
            }

            .stats-title {
                font-size: 20px;
                color: #222;
                margin-bottom: 20px;
            }

            .stats {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .stat-row {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .stat-name {
                width: 90px;
                font-size: 15px;
                color: #333;
            }
            .stat-bar {
                flex: 1;
                height: 12px;
                border: 1px solid #000;
                background: #ddd;
                position: relative;
            }
            .stat-fill {
                height: 100%;
                background: green;
            }
            .stat-value {
                width: 40px;
                text-align: right;
                font-size: 12px;
                color: #111;
            }

            /* Radar mini pantalla */
            .radar-container {
                margin-top: 20px;
                padding: 10px;
                background: #111;
                border: 3px solid #000;
                border-radius: 8px;
                display: flex;
                justify-content: center;
            }
            canvas {
                max-width: 280px;
                max-height: 280px;
            }

            /* Botón */
            .btn {
                padding: 8px 14px;
                border-radius: 999px;
                font-weight: 700;
                border: 2px solid #000;
                cursor: pointer;
                box-shadow: 0 6px 12px rgba(0,0,0,0.12);
                background: #FFCB05;
                color: #111;
                transition: transform .15s;
            }
            .btn:active {
                transform: translateY(2px);
            }

        </style>
    </head>
    <body>
        <div class="pokedex">
            <!-- Panel izquierdo -->
            <div class="left-panel">
                <div class="pokemon-name" th:text="${pokemon.name}"></div>
                <div class="pokemon-id" th:text="'#' + ${pokemon.id}"></div>
                <img th:src="${pokemon.sprites.front_default}" alt="pokemon"/>
            </div>

            <!-- Panel derecho -->
            <div class="right-panel">
                <div class="stats-title">ESTADÍSTICAS</div>
                <div class="stats">
                    <div class="stat-row" th:each="st : ${pokemon.stats}">
                        <div class="stat-name" th:text="${st.stat.name}"></div>
                        <div class="stat-bar">
                            <div class="stat-fill"
                                 th:style="'width:' + (${st.base_stat}*1.2) + 'px; background:' + (${st.base_stat} > 100 ? 'green' : (${st.base_stat} > 50 ? 'orange' : 'red'))">
                            </div>
                        </div>
                        <div class="stat-value" th:text="${st.base_stat}"></div>
                    </div>
                </div>

                <div class="radar-container">
                    <canvas id="radarChart"></canvas>
                </div>

                <div style="display:flex; justify-content:center; margin-top:25px;">
                    <button class="btn" type="button" onclick="window.history.back()">Back</button>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            const stats = [[${pokemon.stats
            }
            ]];
            const labels = stats.map(s => s.stat.name);
            const values = stats.map(s => s.base_stat);
            const ctx = document.getElementById('radarChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                            data: values, // 👈 sin label
                            fill: true,
                            backgroundColor: 'rgba(3, 169, 244, 0.3)',
                            borderColor: 'rgba(3, 169, 244, 1)',
                            pointBackgroundColor: 'rgba(3, 169, 244, 1)',
                        }]
                },
                options: {
                    responsive: true,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 200,
                            angleLines: {color: '#666'},
                            grid: {color: '#999'},
                            pointLabels: {color: '#fff', font: {size: 10}}
                        }
                    },
                    plugins: {legend: {display: false}} // 👈 se quita la leyenda
                }
            });
        </script>

    </body>
</html>
