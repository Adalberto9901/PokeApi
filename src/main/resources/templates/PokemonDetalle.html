<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Pokédex - Detalle</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {
                font-family: 'Press Start 2P', monospace;
                background: linear-gradient(to bottom, #e63946, #9d0208);
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .pokedex {
                width: 1150px;
                max-width: 95%;
                background: #b71c1c;
                border: 10px solid #000;
                border-radius: 12px;
                display: flex;
                box-shadow: 0 12px 25px rgba(0,0,0,0.5);
                overflow: hidden;
            }

            /* Panel izquierdo */
            .left-panel {
                flex: 1;
                background: #111;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 25px;
                border-right: 8px solid #000;
            }

            .pokemon-name {
                font-size: 35px;
                color: #ffeb3b;
                text-transform: uppercase;
                margin-bottom: 10px;
            }

            .pokemon-id {
                font-size: 20px;
                color: #03a9f4;
                margin-bottom: 20px;
            }

            .main-sprite {
                width: 180px;
                height: 180px;
                image-rendering: pixelated;
                margin-bottom: 20px;
            }

            /* Cuadro sprites extra estilo pantalla */
            .sprites-extra {
                margin-top: 10px;
                padding: 12px;
                background: #ffffff;
                border: 3px inset #ccc;
                border-radius: 10px;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
                box-shadow: inset 0 0 12px rgba(255, 235, 59, 0.5),
                    0 0 8px rgba(0,0,0,0.3);
                position: relative;
            }

            .sprites-extra::after {
                content: "";
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                background: repeating-linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.05) 0px,
                    rgba(0,0,0,0.05) 2px,
                    transparent 2px,
                    transparent 4px
                    );
                border-radius: 10px;
            }

            .sprite-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 11px;
                color: #111;
                cursor: pointer;
            }

            .sprite-card img {
                width: 80px;
                height: 80px;
                image-rendering: pixelated;
                border: 2px solid transparent;
                border-radius: 5px;
            }

            .sprite-card.selected img {
                border-color: #03a9f4;
            }

            /* Panel derecho */
            .right-panel {
                flex: 2;
                background: #f5f5f5;
                padding: 15px;
                display: flex;
                flex-direction: column;
                position: relative;
            }

            .right-panel::after {
                content: "";
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                background: repeating-linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.05) 0px,
                    rgba(0,0,0,0.05) 2px,
                    transparent 2px,
                    transparent 4px
                    );
            }

            .stats-title {
                font-size: 20px;
                color: #222;
                margin-bottom: 20px;
            }

            .stats {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .stat-row {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .stat-name {
                width: 90px;
                font-size: 15px;
                color: #333;
            }

            .stat-bar {
                flex: 1;
                height: 12px;
                border: 1px solid #000;
                background: #ddd;
                position: relative;
            }

            .stat-fill {
                height: 100%;
                background: green;
            }

            .stat-value {
                width: 40px;
                text-align: right;
                font-size: 12px;
                color: #111;
            }

            .radar-container {
                margin-top: 20px;
                padding: 10px;
                background: #111;
                border: 3px solid #000;
                border-radius: 8px;
                display: flex;
                justify-content: center;
            }

            canvas {
                max-width: 280px;
                max-height: 280px;
            }

            .btn {
                padding: 8px 14px;
                border-radius: 999px;
                font-weight: 700;
                border: 2px solid #000;
                cursor: pointer;
                box-shadow: 0 6px 12px rgba(0,0,0,0.12);
                background: #FFCB05;
                color: #111;
                transition: transform .15s;
            }

            .btn:active {
                transform: translateY(2px);
            }

            /* Cuadro de descripción estilo pantalla retro */
            .pokemon-description {
                margin-top: 15px;
                padding: 12px;
                background: #ffffff;
                border: 3px inset #ccc;
                border-radius: 10px;
                box-shadow: inset 0 0 12px rgba(255, 235, 59, 0.5),
                    0 0 8px rgba(0,0,0,0.3);
                max-width: 90%;
                text-align: center;
                font-size: 12px;
                color: #111;
                position: relative;
            }

            .pokemon-description::after {
                content: "";
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                background: repeating-linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.05) 0px,
                    rgba(0,0,0,0.05) 2px,
                    transparent 2px,
                    transparent 4px
                    );
                border-radius: 10px;
            }

            /* Partículas */
            .particles {
                position: fixed;
                inset: 0;
                z-index: 5;
                pointer-events: none;
                overflow: hidden;
            }
            .particle {
                position: absolute;
                border-radius: 200%;
                background: rgba(255,255,255,0.9);
                box-shadow: 0 0 20px rgba(255,255,255,0.9);
                animation: floatParticle linear infinite;
            }
            @keyframes floatParticle {
                20% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
                100% {
                    transform: translateY(-100vh) scale(0.6);
                    opacity: 0;
                }
            }

        </style>
    </head>
    <body>
        <div class="particles" id="particles"></div>
        <div class="pokedex">
            <!-- Panel izquierdo -->
            <div class="left-panel">
                <div class="pokemon-name" th:text="${pokemon.name}"></div>
                <div class="pokemon-id" th:text="'#' + ${pokemon.id}"></div>
                <img id="mainSprite" class="main-sprite" th:src="${pokemon.sprites.front_default}" alt="pokemon"/>
                <div class="pokemon-description" th:text="${pokemon.descripcion}"> </div>

                <div class="sprites-extra">
                    <div class="sprite-card selected" th:attr="data-url=${pokemon.sprites.front_default}">
                        <img th:src="${pokemon.sprites.front_default}" alt="Front"/>
                        <span>Front</span>
                    </div>
                    <div class="sprite-card" th:attr="data-url=${pokemon.sprites.back_default}">
                        <img th:src="${pokemon.sprites.back_default}" alt="Back"/>
                        <span>Back</span>
                    </div>
                    <div class="sprite-card" th:attr="data-url=${pokemon.sprites.front_shiny}">
                        <img th:src="${pokemon.sprites.front_shiny}" alt="Front Shiny"/>
                        <span>Front Shiny</span>
                    </div>
                    <div class="sprite-card" th:attr="data-url=${pokemon.sprites.back_shiny}">
                        <img th:src="${pokemon.sprites.back_shiny}" alt="Back Shiny"/>
                        <span>Back Shiny</span>
                    </div>
                </div>


            </div>

            <!-- Panel derecho -->
            <div class="right-panel">
                <div class="stats-title">ESTADÍSTICAS</div>
                <div class="stats">
                    <div class="stat-row" th:each="st : ${pokemon.stats}">
                        <div class="stat-name" th:text="${st.stat.name}"></div>
                        <div class="stat-bar">
                            <div class="stat-fill"
                                 th:style="'width:' + (${st.base_stat}*1.2) + 'px; background:' + (${st.base_stat} > 100 ? 'green' : (${st.base_stat} > 50 ? 'orange' : 'red'))">
                            </div>
                        </div>
                        <div class="stat-value" th:text="${st.base_stat}"></div>
                    </div>
                </div>

                <div class="radar-container">
                    <canvas id="radarChart"></canvas>
                </div>

                <div style="display:flex; justify-content:center; margin-top:25px;">
                    <button class="btn" type="button" onclick="window.history.back()">Back</button>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            function selectSprite(url, element) {
            document.getElementById('mainSprite').src = url;
            document.querySelectorAll('.sprite-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            }

            const stats = [[${pokemon.stats
            }
            ]];
            const labels = stats.map(s => s.stat.name);
            const values = stats.map(s => s.base_stat);
            const ctx = document.getElementById('radarChart').getContext('2d');
            new Chart(ctx, {
            type: 'radar',
                    data: {
                    labels: labels,
                            datasets: [{
                            data: values,
                                    fill: true,
                                    backgroundColor: 'rgba(3, 169, 244, 0.3)',
                                    borderColor: 'rgba(3, 169, 244, 1)',
                                    pointBackgroundColor: 'rgba(3, 169, 244, 1)',
                            }]
                    },
                    options: {
                    responsive: true,
                            scales: {
                            r: {
                            beginAtZero: true,
                                    max: 200,
                                    angleLines: {color: '#666'},
                                    grid: {color: '#999'},
                                    pointLabels: {color: '#fff', font: {size: 10}}
                            }
                            },
                            plugins: {legend: {display: false}}
                    }
            });
        </script>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
            const mainSprite = document.getElementById('mainSprite');
            const spriteCards = document.querySelectorAll('.sprite-card');
            spriteCards.forEach(card => {
            card.addEventListener('click', function() {
            mainSprite.src = this.dataset.url;
            spriteCards.forEach(c => c.classList.remove('selected'));
            this.classList.add('selected');
            });
            });
            });
        </script>

        <script>
            // GENERAR PARTICULAS (una sola vez)
            (function createParticles() {
            const container = document.getElementById("particles");
            if (!container) return;
            if (container.dataset.created) return;
            for (let i = 0; i < 35; i++) {
            const particle = document.createElement("div");
            particle.className = "particle";
            const size = Math.random() * 6 + 3;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.bottom = `-${10 + Math.random() * 40}px`;
            particle.style.animationDuration = `${6 + Math.random() * 8}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            container.appendChild(particle);
            }
            container.dataset.created = true;
            })();
        </script>

    </body>
</html>
