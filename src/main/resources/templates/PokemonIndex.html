
<html xmlns:th="http://www.thymeleaf.org">
    <head>        
        <title>Tarjetas de Información</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            body {
                font-family: 'Segoe UI', sans-serif;
                background-color: #f4f4f4;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                padding: 40px;
            }

            .card {
                background-color: white;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                width: 250px;
                margin: 20px;
                overflow: hidden;
                transition: transform 0.2s ease-in-out;
            }

            .card:hover {
                transform: translateY(-5px);
            }

            .card img {
                width: 100%;
                height: 200px;
                object-fit: cover;
            }

            .card-content {
                padding: 15px;
            }

            .card-content h3 {
                margin-top: 0;
                margin-bottom: 10px;
                font-size: 20px;
                color: #333;
            }

            .card-content p {
                margin: 0;
                font-size: 14px;
                color: #666;
            }
        </style>
    </head>
