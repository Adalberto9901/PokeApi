<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Pokedex</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            body {
                font-family: 'Press Start 2P', monospace;
                background: linear-gradient(to bottom, #e63946, #a80000);
                margin: 0;
                padding: 0;
                overflow-x: hidden;
            }

            /* Fondo dinámico */
            .bg-blob {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                overflow: hidden;
            }
            .bg-blob::before,
            .bg-blob::after {
                content: "";
                position: absolute;
                border-radius: 50%;
                filter: blur(60px);
                opacity: 0.16;
                animation: blobMove 12s linear infinite;
            }
            .bg-blob::before {
                width: 700px;
                height: 700px;
                background: radial-gradient(circle at 30% 30%, rgba(255,235,59,0.25), rgba(255,152,0,0.05));
                top: -10%;
                left: -10%;
                animation-duration: 14s;
            }
            .bg-blob::after {
                width: 900px;
                height: 900px;
                background: radial-gradient(circle at 70% 70%, rgba(42,117,187,0.18), rgba(0,0,0,0.02));
                bottom: -15%;
                right: -5%;
                animation-duration: 18s;
                animation-direction: reverse;
            }
            @keyframes blobMove {
                0% {
                    transform: translate(0,0) scale(1);
                }
                50% {
                    transform: translate(30px,-20px) scale(1.05);
                }
                100% {
                    transform: translate(0,0) scale(1);
                }
            }

            /* Partículas */
            .particles {
                position: fixed;
                inset: 0;
                z-index: 5;
                pointer-events: none;
                overflow: hidden;
            }
            .particle {
                position: absolute;
                border-radius: 200%;
                background: rgba(255,255,255,0.9);
                box-shadow: 0 0 20px rgba(255,255,255,0.9);
                animation: floatParticle linear infinite;
            }
            @keyframes floatParticle {
                20% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
                100% {
                    transform: translateY(-100vh) scale(0.6);
                    opacity: 0;
                }
            }

            .pokemon-logo {
                width: 400px;
                height: auto;
                display: block;
                margin: 0 auto;
            }

            .header {
                position: relative;
                z-index: 2;
                padding: 10px 0 0 0;
            }
            .pokeball {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                background: linear-gradient(#e33 48%, #fff 50%);
                position: absolute;
                left: 20px;
                top: 10px;
                z-index: 3;
                box-shadow: 0 4px 8px rgba(0,0,0,0.25);
                border: 6px solid #000;
                transform: translateY(6px);
            }
            .pokeball::after {
                content: "";
                width: 22px;
                height: 22px;
                background: #fff;
                border-radius: 50%;
                border: 4px solid #000;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }

            .container {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 30px;
                max-width: 1260px;
                margin: 30px auto 80px auto;
                padding: 30px;
                position: relative;
                z-index: 2;
            }
            @media (max-width: 992px) {
                .container {
                    grid-template-columns: repeat(2, 1fr);
                    max-width: 920px;
                    padding: 24px;
                }
            }
            @media (max-width: 600px) {
                .container {
                    grid-template-columns: 1fr;
                    max-width: 420px;
                    padding: 18px;
                    gap: 18px;
                }
            }

            .card {
                perspective: 1200px;
            }

            .card-inner {
                position: relative;
                transform-style: preserve-3d;
                transition: transform 0.75s cubic-bezier(.2,.9,.2,1);
                min-height: 360px;
                border-radius: 25px;
                border: 5px solid #222;
            }

            .card:hover .card-inner,
            .card.flip .card-inner {
                transform: rotateY(180deg);
            }

            .card-face {
                position: absolute;
                inset: 0;
                backface-visibility: hidden;
                border-radius: 20px;
                overflow: hidden;
                background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(250,250,250,0.75));
                backdrop-filter: blur(6px);
                box-shadow: 0 6px 18px rgba(0,0,0,0.16);
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .card-front {
                padding: 22px;
            }
            .card-back {
                transform: rotateY(180deg);
                padding: 20px;
                justify-content: flex-start;
                gap: 12px;
            }

            .pokemon-image {
                width: 170px;
                height: 170px;
                display: block;
                object-fit: contain;
                margin-top: 8px;
                position: relative;
                overflow: visible;
                background: none;
                box-shadow: none;
                border-radius: 0;
            }
            .pokemon-image::after {
                content: "";
                position: absolute;
                left: -150%;
                top: 0;
                height: 100%;
                width: 60%;
                background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.28) 50%, rgba(255,255,255,0) 100%);
                transform: skewX(-20deg);
                animation: shimmer 2.2s infinite;
            }
            @keyframes shimmer {
                0% {
                    left: -150%;
                }
                100% {
                    left: 150%;
                }
            }

            .card-front .card-title {
                margin-top: 8px;
                text-align: center;
            }
            .pokemon-id {
                font-weight: 700;
                color: #000;
                font-size: 17px;
                margin-bottom: 6px;
            }
            .card-front h2 {
                font-size: 22px;
                margin: 0;
                color: #222;
                text-transform: capitalize;
            }

            .types {
                display: flex;
                justify-content: center;
                gap: 10px;
                flex-wrap: wrap;
                margin-top: 12px;
            }
            .type {
                padding: 6px 14px;
                border-radius: 20px;
                font-size: 14px;
                font-weight: bold;
                color: white;
                text-transform: capitalize;
                box-shadow: 0 2px 6px rgba(0,0,0,0.18);
                transform: translateY(0);
                transition: transform 0.25s ease;
            }
            .card:hover .type {
                transform: translateY(-6px);
            }

            .type.grass {
                background: #78C850;
            }
            .type.fire {
                background: #F08030;
            }
            .type.water {
                background: #4068c7;
            }
            .type.bug {
                background: #A8B820;
            }
            .type.normal {
                background: #A8A878;
            }
            .type.poison {
                background: #A040A0;
            }
            .type.electric {
                background: #F8D030;
                color:#333;
            }
            .type.ground {
                background: #E0C068;
                color:#333;
            }
            .type.fairy {
                background: #EE99AC;
                color:#333;
            }
            .type.fighting {
                background: #C03028;
            }
            .type.flying {
                background: #9ad1d6;
                color:#333;
            }
            .type.psychic {
                background: #F85888;
            }
            .type.rock {
                background: #B8A038;
                color:#333;
            }
            .type.ghost {
                background: #705898;
            }
            .type.ice {
                background: #6dc0d1;
                color:#333;
            }
            .type.dragon {
                background: #7038F8;
            }
            .type.dark {
                background: #705848;
            }
            .type.steel {
                background: #B8B8D0;
                color:#333;
            }

            .stats {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-top: 6px;
            }
            .stat-row {
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 13px;
            }
            .stat-name {
                width: 90px;
                color: #333;
                text-transform: capitalize;
            }
            .stat-bar {
                flex: 1;
                height: 10px;
                background: #eee;
                border-radius: 12px;
                overflow: hidden;
                position: relative;
            }
            .stat-fill {
                height: 100%;
                transform-origin: left;
                transform: scaleX(0);
                background: linear-gradient(90deg, rgba(255,200,0,0.95), rgba(255,120,0,0.9));
                transition: transform 0.9s cubic-bezier(.2,.9,.2,1);
            }
            .stat-value {
                width: 42px;
                text-align: right;
                color: #333;
                font-weight: 700;
            }

            .card.flip .stat-fill,
            .card:hover .stat-fill {
                transform: scaleX(1);
            }

            .card-actions {
                margin-top: auto;
                width: 100%;
                display: flex;
                justify-content: center;
                gap: 12px;
                padding: 12px 6px;
            }
            .btn {
                padding: 8px 14px;
                border-radius: 999px;
                font-weight: 700;
                border: 2px solid #000;
                cursor: pointer;
                box-shadow: 0 6px 12px rgba(0,0,0,0.12);
                background: #FFCB05;
                color: #111;
                transition: transform .15s;
            }
            .btn:active {
                transform: translateY(2px);
            }

            .card {
                opacity: 0;
                transform: translateY(12px);
            }
            .card.loaded {
                animation: appear 0.7s forwards ease;
            }
            @keyframes appear {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .container > .card:nth-child(3n+1).loaded {
                animation-delay: 0.05s;
            }
            .container > .card:nth-child(3n+2).loaded {
                animation-delay: 0.15s;
            }
            .container > .card:nth-child(3n+3).loaded {
                animation-delay: 0.25s;
            }

            @media (max-width: 600px) {
                .card-inner {
                    min-height: 320px;
                }
                .pokemon-image {
                    width: 140px;
                    height: 140px;
                }
            }

            /* BARRA DE BÚSQUEDA */
            .search-bar {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 16px;
                margin: 30px auto 50px;
                max-width: 800px;
                padding: 15px 20px;
                border-radius: 50px;
                background: rgba(255,255,255,0.05);
                box-shadow: 0 8px 20px rgba(0,0,0,0.12);
                backdrop-filter: blur(10px);
                border: 2px solid rgba(255,255,255,0.15);
                flex-wrap: wrap;
            }

            /* Select de tipo */
            .type-select {
                flex: 0 0 160px;
                padding: 12px 18px;
                border-radius: 50px;
                border: 2px solid #2A75BB;
                background: #fff;
                font-size: 16px;
                outline: none;
                box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            }

            /* Wrapper del input con la lupa */
            .search-input-wrapper {
                flex: 1 1 0;
                position: relative;
            }

            /* Input de búsqueda */
            .search-input-wrapper input {
                width: 108%;
                padding: 12px 18px 12px 40px;
                border-radius: 50px;
                border: 2px solid #2A75BB;
                font-size: 15px;
                outline: none;
                box-shadow: 0 4px 8px rgba(0,0,0,0.08);
                flex-wrap: wrap;
            }

            /* Lupa dentro del input */
            .search-input-wrapper::before {
                content: '🔍';
                position: absolute;
                left: 14px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 18px;
                color: #2A75BB;
                pointer-events: none;
            }

            /* Botón de búsqueda */
            .search-button {
                flex: 0 0 auto;
                padding: 12px 22px;
                border-radius: 50px;
                border: 2px solid #2A75BB;
                background: linear-gradient(135deg, #FFCB05, #FFD740);
                color: #2A75BB;
                font-weight: 700;
                cursor: pointer;
                box-shadow: 0 4px 10px rgba(0,0,0,0.15);
                transition: all 0.3s ease;
                position: relative;
                z-index: 2;
            }

            .search-button:hover {
                background: #2A75BB;
                color: #fff;
                transform: translateY(-2px) scale(1.05);
                box-shadow: 0 6px 14px rgba(0,0,0,0.2);
            }

            .search-input-wrapper input:focus,
            .type-select:focus {
                box-shadow: 0 0 12px rgba(42,117,187,0.5);
                transform: scale(1.03);
            }

            /* PAGINACION ESTILIZADA */
            .pagination {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
                margin: 40px 0;
                flex-wrap: wrap;
                font-family: 'Segoe UI', sans-serif;
            }

            .pagination a {
                display: inline-block;
                padding: 10px 16px;
                border-radius: 50px;
                background: linear-gradient(135deg, #FFCB05, #FFD740);
                color: #2A75BB;
                font-weight: bold;
                text-decoration: none;
                transition: all 0.3s ease;
                box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            }

            .pagination a:hover {
                background: #2A75BB;
                color: #fff;
                transform: translateY(-2px) scale(1.05);
                box-shadow: 0 6px 14px rgba(0,0,0,0.2);
            }

            .pagination a.active {
                background: #2A75BB;
                color: #FFD740;
                font-weight: 900;
                transform: scale(1.1);
                box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            }

            /*            PANTALLA CARGA*/
            #loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #111;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                color: #fff;
                font-family: 'Press Start 2P', cursive;
            }

            /*            Pokéball animada*/
            .pokeball {
                width: 80px;
                height: 80px;
                background: white;
                border: 4px solid black;
                border-radius: 50%;
                position: relative;
                overflow: hidden;
                animation: shake 1.2s infinite;
            }

            .pokeball::before {
                content: "";
                position: absolute;
                top: 0;
                width: 100%;
                height: 50%;
                background: red;
            }
            /*pertnece a la bolita de en medio*/
            .pokeball::after {
                content: "";
                position: absolute;
                top: 45%;
                left: 35%;
                width: 30%;
                height: 30%;
                background: white;
                border: 4px solid black;
                border-radius: 50%;
                z-index: 2;
            }

            /*            Animación de la pokeball*/
            @keyframes shake {
                0% {
                    transform: translate(0, 0) rotate(0deg);
                }
                20% {
                    transform: translate(-5px, 0) rotate(-20deg);
                }
                40% {
                    transform: translate(5px, 0) rotate(20deg);
                }
                60% {
                    transform: translate(-5px, 0) rotate(-10deg);
                }
                80% {
                    transform: translate(5px, 0) rotate(10deg);
                }
                100% {
                    transform: translate(0, 0) rotate(0deg);
                }
            }

            /*            Texto*/
            .loading-text {
                margin-top: 20px;
                font-size: 14px;
            }

            /*            Barra de progreso*/
            .progress-bar {
                margin-top: 20px;
                width: 200px;
                height: 10px;
                background: #333;
                border: 2px solid #fff;
                border-radius: 10px;
                overflow: hidden;
            }

            .progress {
                width: 0%;
                height: 100%;
                background: linear-gradient(90deg, red, yellow, green);
                animation: loadProgress 3s linear forwards;
            }

            @keyframes loadProgress {
                from {
                    width: 0%;
                }
                to {
                    width: 100%;
                }
            }
            .tags-container {
                margin-top: 10px;
            }

            .tag {
                display: inline-block;
                background-color: #007bff;
                color: white;
                padding: 5px 10px;
                border-radius: 5px;
                margin: 5px;
                font-size: 14px;
                position: relative;
            }

            .tag .remove {
                cursor: pointer;
                margin-left: 8px;
                color: white;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div class="bg-blob" aria-hidden="true"></div>
        <div class="particles" id="particles"></div>

        <div class="header">
            <div class="pokeball" aria-hidden="true"></div>
            <h1>
                <a href="/pokemon/index">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" 
                         alt="Pokédex" 
                         class="pokemon-logo">
                </a>
            </h1>
        </div>


        <form action="/pokemon/index" id="formBusqueda" name="formBusqueda"  method="get" class="search-bar">

            <select name="tipo" class="type-select" id="tipo">
                <option value="">Todos los tipos</option>
                <option value="grass">Planta</option>
                <option value="fire">Fuego</option>
                <option value="flying">Volador</option>
                <option value="water">Agua</option>
                <option value="bug">Bicho</option>
                <option value="normal">Normal</option>
                <option value="poison">Veneno</option>
                <option value="electric">Eléctrico</option>
                <option value="ground">Tierra</option>
                <option value="fairy">Hada</option>
                <option value="fighting">Lucha</option>
                <option value="psychic">Psíquico</option>
                <option value="rock">Roca</option>
                <option value="ghost">Fantasma</option>
                <option value="ice">Hielo</option>
                <option value="dragon">Dragón</option>
                <option value="dark">Siniestro</option>
                <option value="steel">Acero</option>
            </select>
            <div class="tags-container" id="tagsContainer"></div>

            <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="Nombre o número (ej. Pikachu o 25)"
                       id="pokemon" name="search">
            </div>

            <button type="submit" class="search-button">Buscar</button>
        </form>

        <!--        Pantalla de carga estilo Pokédex -->
        <div id="loading-screen">
            <div class="pokeball"></div>
            <p class="loading-text">Cargando Pokédex...</p>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>

        <div class="container">

            <!-- cada tarjeta -->
            <div class="card" th:each="pokemon, iterStat : ${pokemons}">
                <div class="card-inner">
                    <!-- FRONT -->
                    <div class="card-face card-front">
                        <div class="pokemon-id" th:text="'#' + ${pokemon.id}"></div>
                        <img class="pokemon-image"
                             th:src="${pokemon.sprites.front_default}"
                             th:alt="${pokemon.name}" />
                        <div class="card-title">
                            <h2 th:text="${pokemon.name}"></h2>
                        </div>

                        <div class="types">
                            <span class="type" 
                                  th:each="tipo : ${pokemon.types}" 
                                  th:text="${tipo.type.name}" 
                                  th:classappend="' ' + ${tipo.type.name}">
                            </span>
                        </div>
                    </div>

                    <!-- BACK -->
                    <div class="card-face card-back">
                        <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                            <div style="font-weight:800; text-transform:capitalize;" th:text="${pokemon.name}">Pokemon</div>
                            <div style="font-size:12px; color:#666;" th:text="'#' + ${pokemon.id}"></div>
                        </div>

                        <div style="margin-top:12px; font-size:13px; color:#444; font-weight:700;">Base Stats</div>

                        <div class="stats">
                            <div class="stat-row" th:each="st : ${pokemon.stats}">
                                <div class="stat-name" th:text="${st.stat.name}">hp</div>
                                <div class="stat-bar">
                                    <div class="stat-fill" th:style="'width:' + ${st.base_stat} + '%;'"></div>
                                </div>
                                <div class="stat-value" th:text="${st.base_stat}">45</div>
                            </div>
                        </div>
                        <div style="flex:1;"></div>
                        <div style="width:100%; display:flex; justify-content:center; margin-top:12px;">
                            <button class="btn" type="button" th:onclick="'location.href=\'/pokemon/detalle/' + ${pokemon.id} + '\';'">Detail</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGINACION -->
        <div class="pagination" th:if="${totalPages > 1 && tipos == null }">
            <!-- Botón anterior -->
            <a th:if="${currentPage > 1}" 
               th:href="@{/pokemon/index(page=${currentPage - 1})}" 
               class="page-btn">&laquo; Anterior</a>

            <span th:each="i : ${#numbers.sequence(
                  (currentPage > 10 ? currentPage - 10 : 1),
                  (currentPage + 9 <= totalPages ? currentPage + 9 : totalPages)
                  )}">
                <a th:href="@{/pokemon/index(page=${i})}" 
                   th:text="${i}" 
                   th:classappend="${i == currentPage} ? ' active'" 
                   class="page-btn"></a>
            </span>

            <!-- Botón siguiente -->
            <a th:if="${currentPage < totalPages}" 
               th:href="@{/pokemon/index(page=${currentPage + 1})}" 
               class="page-btn">Siguiente &raquo;</a>
        </div>

        <!-- PAGINACION DE TIPOS -->
        <div class="pagination" th:if="${totalPages > 1 && tipos != null }">
            <!-- Botón anterior -->
            <a th:if="${currentPage > 1}"
               th:href="@{/pokemon/index(
               page=${currentPage - 1},
               tipo=${tipos},
               search=${search}
               )}" 
               class="page-btn">&laquo; Anterior</a>

            <span th:each="i : ${#numbers.sequence(
                  (currentPage > 10 ? currentPage - 10 : 1),
                  (currentPage + 9 <= totalPages ? currentPage + 9 : totalPages)
                  )}">
                <a th:href="@{/pokemon/index(
                   page=${i},
                   tipo=${tipos},
                   search=${search}
                   )}" 
                   th:text="${i}" 
                   th:classappend="${i == currentPage} ? ' active'" 
                   class="page-btn"></a>
            </span>

            <!-- Botón siguiente -->
            <a th:if="${currentPage < totalPages}"
               th:href="@{/pokemon/index(
               page=${currentPage + 1},
               tipo=${tipos},
               search=${search}
               )}" 
               class="page-btn">Siguiente &raquo;</a>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function () {


                // GENERAR PARTICULAS (una sola vez)
                (function createParticles() {
                    const container = document.getElementById("particles");
                    if (!container)
                        return;
                    if (container.dataset.created)
                        return;
                    for (let i = 0; i < 35; i++) {
                        const particle = document.createElement("div");
                        particle.className = "particle";

                        const size = Math.random() * 6 + 3;
                        particle.style.width = `${size}px`;
                        particle.style.height = `${size}px`;

                        particle.style.left = `${Math.random() * 100}%`;
                        particle.style.bottom = `-${10 + Math.random() * 40}px`;

                        particle.style.animationDuration = `${6 + Math.random() * 8}s`;
                        particle.style.animationDelay = `${Math.random() * 5}s`;

                        container.appendChild(particle);
                    }
                    container.dataset.created = '1';
                })();

                function runAppearOnCards() {
                    const cards = document.querySelectorAll('.container > .card');
                    cards.forEach((card, i) => {
                        card.classList.remove('loaded');
                        setTimeout(() => card.classList.add('loaded'), 80 * (i % 6));
                    });
                }

                document.addEventListener('click', function (e) {
                    const card = e.target.closest('.card');
                    if (!card)
                        return;

                    if (e.target.closest('button') || e.target.closest('a'))
                        return;

                    if (window.innerWidth <= 900) {
                        card.classList.toggle('flip');
                    }
                });

                runAppearOnCards();

                // llenar el contain de los dos tipos de pokemon antes de hacer la accion del formulario
                const selectedValues = [];

                const select = document.getElementById("tipo");
                const tagsContainer = document.getElementById("tagsContainer");
                const form = document.getElementById("formBusqueda");
                if (!form)
                    return;

                select.addEventListener("change", function () {
                    const selected = select.value;

                    if (selectedValues.length >= 2) {
                        alert("Solo puedes seleccionar hasta 2 opciones.");
                        select.value = "";
                        return;
                    }

                    if (selectedValues.includes(selected)) {
                        select.value = "";
                        return;
                    }

                    selectedValues.push(selected);
                    renderTags();
                    select.value = "";
                });

                function renderTags() {
                    tagsContainer.innerHTML = "";

                    selectedValues.forEach((val, index) => {
                        const tag = document.createElement("div");
                        tag.className = "tag";
                        tag.innerHTML = `${val} <span class="remove" data-index="${index}">&times;</span>`;
                        tagsContainer.appendChild(tag);
                    });

                    document.querySelectorAll(".remove").forEach(btn => {
                        btn.addEventListener("click", function () {
                            const index = this.getAttribute("data-index");
                            selectedValues.splice(index, 1);
                            renderTags();
                        });
                    });
                }

                // accion del form de busqueda
                form.addEventListener('submit', function (event) {
                    event.preventDefault();

                    const nombre = (document.getElementById("pokemon") || {}).value || '';
                    document.querySelectorAll('input[name="tipo"]').forEach(el => el.remove());

                    // Agregar input hidden por cada tipo seleccionado
                    selectedValues.forEach(val => {
                        const hiddenInput = document.createElement('input');
                        hiddenInput.type = 'hidden';
                        hiddenInput.name = 'tipo';
                        hiddenInput.value = val;
                        form.appendChild(hiddenInput);
                    });

                    const queryParams = new URLSearchParams();
                    if (nombre)
                        queryParams.append('search', nombre);
                    selectedValues.forEach(val => queryParams.append('tipo', val));

                    const url = `/pokemon/index?${queryParams.toString()}`;

                    fetch(url, {
                        method: 'GET',
                        headers: {'X-Requested-With': 'XMLHttpRequest'}
                    })
                            .then(resp => {
                                if (!resp.ok)
                                    throw new Error('Respuesta no OK');
                                return resp.text();
                            })
                            .then(htmlText => {
                                const parser = new DOMParser();
                                const doc = parser.parseFromString(htmlText, 'text/html');

                                const newContainer = doc.querySelector('.container');
                                const newPagination = doc.querySelector('.pagination');
                                const newError = doc.querySelector('.error-message');

                                const currentContainer = document.querySelector('.container');
                                const currentPagination = document.querySelector('.pagination');
                                const currentError = document.querySelector('.error-message');

                                if (newContainer && currentContainer) {
                                    currentContainer.innerHTML = newContainer.innerHTML;
                                } else {
                                    const anyCard = doc.querySelector('.card');
                                    if (anyCard && currentContainer) {
                                        currentContainer.innerHTML = doc.body.innerHTML;
                                    } else {
                                        document.open();
                                        document.write(htmlText);
                                        document.close();
                                        return;
                                    }
                                }

                                if (newPagination) {
                                    if (currentPagination) {
                                        currentPagination.innerHTML = newPagination.innerHTML;
                                    } else {
                                        const cont = document.querySelector('.container');
                                        cont.insertAdjacentElement('afterend', newPagination.cloneNode(true));
                                    }
                                } else {
                                    if (currentPagination)
                                        currentPagination.remove();
                                }

                                if (newError) {
                                    if (currentError)
                                        currentError.replaceWith(newError.cloneNode(true));
                                    else {
                                        const cont = document.querySelector('.container');
                                        cont.insertAdjacentElement('beforebegin', newError.cloneNode(true));
                                    }
                                } else {
                                    if (currentError)
                                        currentError.remove();
                                }
                                applyCardBackgrounds();

                                runAppearOnCards();

                                try {
                                    history.pushState({}, '', url);
                                } catch (e) {
                                }

                            })
                            .catch(err => {
                                console.error('Error en búsqueda:', err);
                                alert('Ocurrió un error al buscar. Revisa la consola.');
                            });
                });

                window.addEventListener('popstate', function () {
                    location.reload();
                });

            });

            document.addEventListener("DOMContentLoaded", function () {
                setTimeout(function () {
                    document.getElementById("loading-screen").style.display = "none";
                }, 3200);
            });

            function applyCardBackgrounds() {
                const cards = document.querySelectorAll(".card-front");

                cards.forEach(card => {
                    const typeElements = card.querySelectorAll(".type");
                    const types = Array.from(typeElements).map(el => {
                        return Array.from(el.classList).find(cls => cls !== "type");
                    });

                    function getTypeColor(typeName) {
                        const temp = document.createElement("span");
                        temp.className = `type ${typeName}`;
                        temp.style.display = "none";
                        document.body.appendChild(temp);
                        const color = getComputedStyle(temp).backgroundColor;
                        temp.remove();
                        return color;
                    }

                    const colors = types.map(getTypeColor);

                    if (colors.length === 1) {
                        card.style.background = colors[0];
                    } else if (colors.length === 2) {
                        card.style.background = `linear-gradient(to right, ${colors[0]} 40%, ${colors[0]} 45%, ${colors[1]} 55%, ${colors[1]} 60%)`;
                    } else {
                        card.style.background = "#ccc";
                    }
                });
            }

            // Ejecutar al cargar la página
            document.addEventListener("DOMContentLoaded", applyCardBackgrounds);

            // Ejecutar también después de cada renderizado de búsqueda o paginación
            window.addEventListener("load", function () {
                applyCardBackgrounds();
            });

        </script>
    </body>
</html>
